# Platform layer, synced by k8s/argocd/apps/platform.yaml once the External Secrets and
# Crossplane controllers (and their CRDs) exist:
#
#   - the ClusterSecretStore every ExternalSecret in the repo reads through (GCP Secret Manager)
#   - Crossplane's Upbound GCP provider family + sub-providers, the functions Compositions run,
#     and the providers' credentials config (Workload Identity - no key file)
#
# The managed resources themselves live next to the workload that uses them (e.g.
# k8s/openlit/manifests/backup-bucket.yaml), as namespaced MRs. A new GCP resource type needs its
# sub-provider in crossplane-packages.yaml and the matching role for the crossplane-gcp GSA in
# gke-deploy.sh.
#
# Argo CD sync waves inside this Application: packages first (0), then the objects whose CRDs
# those packages install (1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cluster-secret-store.yaml
  - crossplane-runtime-config.yaml
  - crossplane-packages.yaml
  - crossplane-provider-config.yaml
