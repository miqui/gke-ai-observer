# Crossplane packages: the Upbound GCP provider family (built from crossplane-contrib/
# provider-upjet-gcp) plus the sub-providers the platform uses. The family package owns the
# ProviderConfig CRDs (crossplane-provider-config.yaml) and manages no resources itself; each
# sub-provider is a separate pod with its own CRDs, at the same version as the family, running
# as the crossplane-gcp GSA through `runtimeConfigRef: {name: provider-gcp}`.
#
#   provider-gcp-storage  GCS: the OpenLIT ClickHouse backup bucket + its IAM bindings
#
# Pinned to exact versions so a sync never upgrades anything by surprise. xpkg.upbound.io serves
# the latest release of an Upbound official package anonymously; older releases stay pullable for
# 12 months from their release date. Bump all three versions together.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-family-gcp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  package: xpkg.upbound.io/upbound/provider-family-gcp:v3.1.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-storage
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  package: xpkg.upbound.io/upbound/provider-gcp-storage:v3.1.0
  runtimeConfigRef:
    name: provider-gcp
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.11.0
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.7.0
