# ClickHouse credentials for OpenLIT, generated inside the cluster: nothing to put in 1Password or
# Secret Manager, nothing in git. External Secrets' Password generator makes a random password
# once (refreshPolicy: CreatedOnce) and writes the `openlit-clickhouse` Secret, which ClickHouse,
# the OpenLIT app and the backup CronJob all read.
#
# The password lives as long as the cluster - exactly like the ClickHouse data it protects (the PVC
# disk is deleted on teardown). Backups in GCS don't depend on it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: openlit-clickhouse
  namespace: openlit
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 32
  digits: 8
  # Letters and digits only: the password ends up in connection strings and shell commands.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openlit-clickhouse
  namespace: openlit
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: openlit-clickhouse
    template:
      data:
        username: default
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: openlit-clickhouse
